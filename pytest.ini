[pytest]
testpaths = tests
# --base-url             lets tests call page.goto("/rooms/room-12")
# --tracing / --screenshot keep a full trace and a screenshot for every failed test
addopts =
    --base-url http://127.0.0.1:8000
    --browser chromium
    --tracing retain-on-failure
    --screenshot only-on-failure
    --output test-results
