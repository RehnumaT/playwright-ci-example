# End to end tests with Playwright on every pull request and every push to main.
# If the tests fail, the pipeline saves the evidence and asks Claude Code to triage the failure.
name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # needed by the Claude Code step below

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install the Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Start the app and wait until it is healthy
        run: |
          nohup uvicorn app:app --port 8000 > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "The app did not start"; cat app.log; exit 1

      - name: Run the Playwright tests
        run: pytest --junitxml=test-results/junit.xml

      - name: Save traces, screenshots, and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            test-results/
            app.log

      - name: Ask Claude Code to triage the failure
        if: failure()
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            The Playwright end to end tests just failed in CI.
            Read test-results/junit.xml and app.log, and follow the rules in CLAUDE.md.
            For each failing test:
            1. Name the test and quote the exact error.
            2. Classify it as a product bug, a test bug, flaky timing, or an environment problem, with your evidence.
            3. Suggest the smallest fix and say which file it belongs in.
            Do not edit any files. Keep the report short.
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Bash(ls *),Bash(cat *)"
